<script>
(()=>{'use strict';
/* ---------- เครื่องมือพื้นฐาน ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sat=x=>Math.round((+x||0)*100);
const fmt=s=>(s/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtZ=s=>s?fmt(s):'-';
const baht=x=>fmt(sat(x));
const MON=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const MONS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'});
const dparts=iso=>{const [y,m,d]=String(iso||today()).split('-').map(Number);return {y,m,d}};
const thDate=iso=>{if(!iso)return '';const {y,m,d}=dparts(iso);return `${d} ${MON[m-1]} ${y+543}`};
const thShort=iso=>{if(!iso)return '';const {y,m,d}=dparts(iso);return `${d} ${MONS[m-1]} ${String(y+543).slice(2)}`};
const fyOf=iso=>{const {y,m}=dparts(iso);return y+543+(m>=10?1:0)};
const fyStart=fy=>`${fy-544}-10-01`, fyEnd=fy=>`${fy-543}-09-30`;
const addDays=(iso,n)=>{const {y,m,d}=dparts(iso);const dt=new Date(Date.UTC(y,m-1,d+n));return dt.toISOString().slice(0,10)};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function bahtText(x){
  let n=sat(x); const neg=n<0; n=Math.abs(n); const b=Math.floor(n/100), s=n%100;
  const D=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'], U=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  const rd=num=>{ if(!num) return ''; const mil=Math.floor(num/1e6), rest=num%1e6; let o=mil?rd(mil)+'ล้าน':'';
    const st=String(rest), L=st.length; if(!rest) return o;
    for(let i=0;i<L;i++){ const v=+st[i], p=L-i-1; if(!v) continue;
      if(p===1) o+= v===1?'สิบ':v===2?'ยี่สิบ':D[v]+'สิบ';
      else if(p===0&&v===1&&(L>1||mil)) o+='เอ็ด';
      else o+=D[v]+U[p]; }
    return o; };
  return (neg?'ลบ':'')+(b?rd(b)+'บาท':(s?'':'ศูนย์บาท'))+(s?rd(s)+'สตางค์':'ถ้วน');
}
const people=txt=>String(txt||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(/[,|]/).map(x=>x.trim());return {name:p[0]||'',pos:p[1]||'',role:p[2]||''}});

/* ---------- สถานะและฐานข้อมูล ---------- */
const COLS=['funds','accounts','tx','reqs','orders','memos','alloc','plans','projects','meta'];
const S={cfg:{},funds:[],accounts:[],tx:[],reqs:[],orders:[],memos:[],alloc:[],plans:[],projects:[],meta:[],loaded:new Set(),canWrite:true,online:false};
const U={page:'dash',fy:fyOf(today()),daily:today(),regMode:'fund',regFund:'',regDoc:'บจ',regAcc:'',ledFund:'',ordTab:'order',dept:'all',pst:'all',pfy:'',pq:'',half:'1',acctTab:'p4'};
const DEPTS=[['aca','ด้านบริหารงานวิชาการ'],['bud','ด้านบริหารงานงบประมาณ'],['per','ด้านบริหารงานบุคคล'],['gen','ด้านบริหารทั่วไป']];
const deptName=id=>(DEPTS.find(d=>d[0]===id)||[,'ไม่ระบุฝ่าย'])[1];
const deptOpts=()=>[['','— เลือกฝ่าย —'],...DEPTS];
let db=null, dl=null, timer=null;
const strip=o=>{const c=JSON.parse(JSON.stringify(o));delete c.id;return c};
function localSet(col,id,data){ if(col==='config'){S.cfg=data;return} const i=S[col].findIndex(x=>x.id===id); const rec={id,...data}; if(i<0)S[col].push(rec); else S[col][i]=rec; if(col==='tx')sortTx(); }
async function put(col,id,data){ id=id||newId(); data=strip(data);
  if(db){ await (col==='config'?db.doc('config/main'):db.collection(col).doc(id)).set(data); }
  localSet(col,id,data); queue(); return id; }
async function del(col,id){ if(db) await db.collection(col).doc(id).delete(); S[col]=S[col].filter(x=>x.id!==id); queue(); }
const sortTx=()=>S.tx.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0));
const queue=()=>{clearTimeout(timer);timer=setTimeout(render,40)};
async function boot(){
  window.addEventListener('hashchange',route); route(); render();
  const c=window.claude;
  try{ db=c&&c.use?await c.use('db'):null }catch(e){ db=null }
  try{ dl=c&&c.use?await c.use('downloads'):null }catch(e){ dl=null }
  try{ const u=c&&c.use?await c.use('user'):null; if(u&&u.can){ const w=await u.can('data.write'); if(w===false) S.canWrite=false } }catch(e){}
  if(!db){ COLS.forEach(k=>S.loaded.add(k)); S.loaded.add('config'); render(); return }
  S.online=true;
  const fail=e=>{ if(e&&e.code==='revoked'){S.online=false;S.canWrite=false;render()} };
  db.doc('config/main').onSnapshot(s=>{S.cfg=s.exists?{...s.data()}:{};S.loaded.add('config');queue()},fail);
  COLS.forEach(k=>db.collection(k).onSnapshot(q=>{S[k]=q.docs.map(d=>({id:d.id,...d.data()}));if(k==='tx')sortTx();S.loaded.add(k);queue()},fail));
}

/* ---------- แกนคำนวณ: ทุกยอดมาจาก "ขา" ของรายการเดียวกัน ---------- */
const fund=id=>S.funds.find(f=>f.id===id);
const acct=id=>S.accounts.find(a=>a.id===id);
const taxFund=()=>S.funds.find(f=>f.sys==='tax');
const GROUPS=['เงินงบประมาณ','เงินอุดหนุนทั่วไป','เงินนอกงบประมาณ','เงินรายได้แผ่นดิน'];
const fundsSorted=()=>[...S.funds].sort((a,b)=>GROUPS.indexOf(a.group)-GROUPS.indexOf(b.group)||String(a.code).localeCompare(String(b.code)));
const lt=loc=>loc==='cash'?'cash':loc==='dep'?'dep':'bank';
const locName=loc=>{ if(loc==='cash')return 'เงินสด'; if(loc==='dep')return 'เงินฝากส่วนราชการผู้เบิก'; const a=acct(String(loc).slice(5)); return a?`${a.bank} ${a.number||''}`.trim():'บัญชีธนาคาร (ถูกลบ)'; };
const fname=id=>fund(id)?.name||'(ประเภทเงินถูกลบ)';
function legs(t){ const a=sat(t.amount);
  switch(t.kind){
    case 'open': case 'recv': return [{f:t.fund,loc:t.loc,d:a}];
    case 'pay': { const L=[{f:t.fund,loc:t.loc,d:-a}]; const tx=sat(t.wht&&t.wht.tax), tf=taxFund(); if(tx&&tf) L.push({f:tf.id,loc:t.loc,d:tx}); return L; }
    case 'move': return [{f:t.fund,loc:t.loc,d:-a},{f:t.fund,loc:t.loc2,d:a}];
    case 'xfund': return [{f:t.fund,loc:t.loc,d:-a},{f:t.fund2,loc:t.loc,d:a}];
    case 'loan': return [{f:t.fund,loc:t.loc,d:-a}];
    case 'loanret': return sat(t.cash)?[{f:t.fund,loc:t.loc,d:sat(t.cash)}]:[];
  } return []; }
const isFlow=t=>t.kind!=='open'&&t.kind!=='move';
function position(upTo,excl){ const P={}; for(const t of S.tx){ if(upTo&&t.date>upTo)continue; if(t.id===excl)continue; for(const l of legs(t)){ (P[l.f]=P[l.f]||{})[l.loc]=(P[l.f][l.loc]||0)+l.d } } return P; }
const fundSum=(P,fid)=>{const o={cash:0,bank:0,dep:0,total:0};for(const [loc,v] of Object.entries(P[fid]||{})){o[lt(loc)]+=v;o.total+=v}return o};
const locSum=(P,loc)=>{let s=0;for(const f in P)s+=P[f][loc]||0;return s};
const grand=P=>{let s=0;for(const f in P)for(const l in P[f])s+=P[f][l];return s};
const avail=(fid,loc,excl)=>((position(null,excl)[fid]||{})[loc]||0);
function allLocs(){ return ['cash',...S.accounts.map(a=>'bank:'+a.id),'dep'] }
function locFlows(fy,upTo){ const st=fyStart(fy), R={}; const g=k=>R[k]=R[k]||{carry:0,in:0,out:0};
  for(const t of S.tx){ if(t.date>upTo)continue; for(const l of legs(t)){ const r=g(l.loc); if(t.date<st||t.kind==='open')r.carry+=l.d; else if(l.d>0)r.in+=l.d; else r.out-=l.d; } } return R; }
function fyTotals(fy,upTo){ const st=fyStart(fy); let i=0,o=0,c=0; const mon=Array.from({length:12},()=>({in:0,out:0}));
  for(const t of S.tx){ if(t.date>upTo)continue; for(const l of legs(t)){ if(t.date<st||t.kind==='open'){c+=l.d;continue} if(!isFlow(t))continue; const k=(dparts(t.date).m+2)%12; if(l.d>0){i+=l.d;mon[k].in+=l.d}else{o-=l.d;mon[k].out-=l.d} } } return {in:i,out:o,carry:c,mon}; }

/* ---------- เลขที่เอกสารและทะเบียนคุมเอกสาร ---------- */
const DOCS={'บร':'ใบเสร็จรับเงิน / หลักฐานการรับเงิน','บจ':'ใบสำคัญจ่าย / หลักฐานการจ่าย','บค':'ใบสำคัญส่งใช้เงินยืม','บส':'ใบนำส่ง / นำฝากส่วนราชการผู้เบิก','บถ':'ใบถอนเงินฝาก','บฝ':'ใบนำฝากธนาคาร','บษ':'ภาษีหัก ณ ที่จ่าย','กง':'บันทึกขอเบิกเงิน','บย':'สัญญายืมเงิน','บรค':'ใบรับคืนเงินยืม'};
const docLabel=k=>(S.cfg.docLabels&&S.cfg.docLabels[k])||DOCS[k]||k;
const DOCOPTS=()=>['บจ','บค','บร','บย'].map(k=>[k,`${k}. ${docLabel(k)}`]);
const ref=(doc,no,date)=>no?`${doc} ${no}/${fyOf(date)}`:'';
function docEntries(t){ const E=[]; const add=(doc,no,amount,desc)=>{ if(no) E.push({doc,no:+no,fy:fyOf(t.date),date:t.date,amount,desc:desc||t.desc||'',fund:t.fund,party:t.party||'',id:t.id}) };
  if(t.kind==='loanret'){ const who=(S.tx.find(x=>x.id===t.loanId)||{}).party||''; add('บค',t.no,t.voucher,'ส่งใช้เงินยืมเป็นใบสำคัญ – '+who); add('บรค',t.no2,t.cash,'รับคืนเงินยืมเป็นเงินสด – '+who); }
  else if(t.doc) add(t.doc,t.no,t.amount);
  if(t.wht&&sat(t.wht.tax)) add('บษ',t.wht.no,t.wht.tax,'ภาษีหัก ณ ที่จ่าย – '+(t.party||''));
  return E; }
function allDocEntries(){ const E=[]; S.tx.forEach(t=>E.push(...docEntries(t)));
  S.reqs.forEach(r=>E.push({doc:'กง',no:+r.no,fy:fyOf(r.date),date:r.date,amount:r.amount,desc:r.purpose,fund:r.fund,party:r.payee||'',id:r.id}));
  return E; }
function nextNo(doc,fy,excl){ let m=0; const scan=(no,d,id)=>{ if(id!==excl&&fyOf(d)===fy&&+no>m)m=+no };
  if(doc==='คำสั่ง') S.orders.forEach(o=>scan(o.no,o.date,o.id));
  else if(doc==='บันทึก') S.memos.forEach(o=>scan(o.no,o.date,o.id));
  else allDocEntries().forEach(e=>{ if(e.doc===doc) scan(e.no,e.date,e.id) });
  return m+1; }

/* ---------- หน้าต่าง, ฟอร์ม, แจ้งเตือน ---------- */
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.body.append(t); setTimeout(()=>t.remove(),2600); }
function modal(title,html,wide){ const o=document.createElement('div'); o.className='ov';
  o.innerHTML=`<div class="dlg${wide?' wide':''}" role="dialog" aria-modal="true"><header><h2>${esc(title)}</h2><button type="button" data-close aria-label="ปิด">×</button></header><div class="body">${html}</div></div>`;
  o.addEventListener('click',e=>{ if(e.target.closest('[data-close]')) o.remove() });
  document.body.append(o); const f=o.querySelector('input,select,textarea,button.pri'); if(f) f.focus(); return o; }
function ask(msg,ok='ยืนยัน'){ return new Promise(res=>{ const m=modal('ยืนยันรายการ',`<p>${esc(msg)}</p><div class="mfoot"><button type="button" class="btn" data-no>ยกเลิก</button><button type="button" class="btn pri" data-yes>${esc(ok)}</button></div>`);
  m.addEventListener('click',e=>{ if(e.target.closest('[data-yes]')){m.remove();res(true)} else if(e.target.closest('[data-no],[data-close]')){m.remove();res(false)} }); }); }
function openForm(o){
  const v0=o.values||{};
  const fhtml=o.fields.map(f=>{ const id='f_'+f.k, val=v0[f.k]??f.def??''; const cls='fld'+(f.full||f.type==='area'||f.type==='note'?' full':'')+(f.type==='check'?' chk':'');
    let inp;
    if(f.type==='checks'){ const arr=Array.isArray(val)?val:[]; return `<div class="fld full" data-row="${f.k}"><span style="font-size:.82rem;font-weight:600">${esc(f.label)}</span><div class="checks">${(f.opts||[]).map(([v,l],i)=>`<label><input type="checkbox" name="${id}" id="${id}_${i}" value="${esc(v)}"${arr.includes(v)?' checked':''}> ${esc(l)}</label>`).join('')||'<span class="hint">ยังไม่มีบัญชีธนาคาร เพิ่มบัญชีก่อน</span>'}</div><span class="hint" data-hint="${f.k}">${esc(f.hint||'')}</span></div>` }
    if(f.type==='select') inp=`<select id="${id}" name="${id}">${(f.opts||[]).map(([v,l])=>`<option value="${esc(v)}"${String(v)===String(val)?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
    else if(f.type==='area') inp=`<textarea id="${id}" name="${id}" ${f.rows?`style="min-height:${f.rows*1.6}em"`:''}>${esc(val)}</textarea>`;
    else if(f.type==='check') return `<div class="${cls}" data-row="${f.k}"><input type="checkbox" id="${id}" name="${id}"${val?' checked':''}><label for="${id}">${esc(f.label)}</label></div>`;
    else if(f.type==='note') return `<div class="${cls}" data-row="${f.k}"><span class="hint">${esc(f.label)}</span></div>`;
    else if(f.type==='date') inp=`<input type="date" id="${id}" name="${id}" value="${esc(val)}">`;
    else if(f.type==='money') inp=`<input type="text" inputmode="decimal" id="${id}" name="${id}" value="${val===''?'':esc(val)}" placeholder="0.00" style="text-align:right">`;
    else if(f.type==='int') inp=`<input type="number" min="1" step="1" id="${id}" name="${id}" value="${esc(val)}">`;
    else inp=`<input type="text" id="${id}" name="${id}" value="${esc(val)}">`;
    return `<div class="${cls}" data-row="${f.k}"><label for="${id}">${esc(f.label)}${f.req?' *':''}</label>${inp}<span class="hint" data-hint="${f.k}">${esc(f.hint||'')}</span></div>`; }).join('');
  const m=modal(o.title,`<form novalidate><div class="fgrid">${fhtml}</div><p class="err" hidden></p><div class="mfoot"><button type="button" class="btn" data-close>ยกเลิก</button><button class="btn pri">${esc(o.ok||'บันทึก')}</button></div></form>`,o.wide);
  const form=$('form',m), errEl=$('.err',m), touched=new Set(Object.keys(v0).filter(k=>o.keepTouched&&v0[k]!==undefined&&v0[k]!==''));
  const el=k=>form.elements['f_'+k];
  const ui={touched,
    get vals(){ const v={}; o.fields.forEach(f=>{ if(f.type==='checks'){ v[f.k]=[...form.querySelectorAll(`input[name="f_${f.k}"]:checked`)].map(x=>x.value); return } const e=el(f.k); if(!e)return; v[f.k]= f.type==='check'?e.checked: f.type==='money'?(Math.round((parseFloat(String(e.value).replace(/,/g,''))||0)*100)/100): f.type==='int'?(parseInt(e.value,10)||0): e.value.trim() }); return v; },
    set(k,val){ const e=el(k); if(e){ if(e.type==='checkbox')e.checked=!!val; else e.value=val } },
    auto(k,val){ if(!touched.has(k)) ui.set(k,val) },
    hint(k,txt){ const h=$(`[data-hint="${k}"]`,form); if(h) h.textContent=txt },
    show(k,on){ const r=$(`[data-row="${k}"]`,form); if(r) r.hidden=!on } };
  form.addEventListener('input',e=>{ const k=(e.target.name||'').slice(2); touched.add(k); o.change&&o.change(ui.vals,ui,k) });
  o.change&&o.change(ui.vals,ui,null);
  form.addEventListener('submit',async e=>{ e.preventDefault(); const v=ui.vals; errEl.hidden=true; const btn=$('button.pri',form);
    try{ for(const f of o.fields){ const r=$(`[data-row="${f.k}"]`,form); if(f.req&&!(r&&r.hidden)&&(v[f.k]===''||v[f.k]===0||v[f.k]==null)) throw new Error('กรุณากรอก "'+f.label+'"') }
      btn.disabled=true; await o.submit(v); m.remove(); toast(o.done||'บันทึกแล้ว'); }
    catch(x){ btn.disabled=false; errEl.textContent=x&&x.code?('บันทึกไม่สำเร็จ ('+x.code+') ตรวจสิทธิ์การแก้ไขหรือลองใหม่อีกครั้ง'):(x.message||String(x)); errEl.hidden=false; } });
  return ui; }
const fundOpts=(noTax)=>fundsSorted().filter(f=>!noTax||f.sys!=='tax').map(f=>[f.id,`${f.code} ${f.name}`]);
const locOpts=()=>[['cash','เงินสด'],...S.accounts.filter(a=>a.status!=='closed').map(a=>['bank:'+a.id,`${a.bank} ${a.number||''} – ${a.name||''}`]),['dep','เงินฝากส่วนราชการผู้เบิก']];
const rawAccs=f=>f?(Array.isArray(f.accs)?f.accs:(f.acc?[f.acc]:[])):[];
const fundAccs=f=>rawAccs(f).filter(id=>acct(id));
const defLoc=fid=>{const a=fundAccs(fund(fid)).find(id=>acct(id).status!=='closed');return a?'bank:'+a:'cash'};
const accLabel=id=>{const a=acct(id);return a?`${a.bank} ${a.number||''}`.trim():''};
const needFunds=()=>{ if(!S.funds.length){toast('ยังไม่มีประเภทเงิน เพิ่มที่เมนูตั้งค่าข้อมูลหลักก่อน');return true} return false };
const chkFunds=(amt,fid,loc,excl)=>{ const a=avail(fid,loc,excl); if(sat(amt)>a) throw new Error(`เงินคงเหลือไม่พอ: ${fname(fid)} ที่ ${locName(loc)} มี ${fmt(a)} บาท`) };

function fundRowsHTML(P,td='td'){ let h='',T={cash:0,bank:0,dep:0,total:0};

    h+=`<tr class="grp"><td colspan="5">${esc(g)}</td></tr>`;
    for(const f of fs){ const b=fundSum(P,f.id); for(const k in G){G[k]+=b[k];T[k]+=b[k]}

async function exportXlsx(title,paper){

    const ws=X.utils.aoa_to_sheet(heads.length?heads:[[title]]);
    root.querySelectorAll('table').forEach(t=>{ X.utils.sheet_add_aoa(ws,[['']],{origin:-1}); X.utils.sheet_add_dom(ws,t,{origin:-1}); });
    if(tail){ const ps=[...root.querySelectorAll(':scope > p')].map(p=>[p.innerText.trim()]).filter(r=>r[0]); if(ps.length){ X.utils.sheet_add_aoa(ws,[['']],{origin:-1}); X.utils.sheet_add_aoa(ws,ps,{origin:-1}); } }
    const cols=[]; const rg=X.utils.decode_range(ws['!ref']); for(let c=rg.s.c;c<=rg.e.c;c++){ let w=8; for(let r=rg.s.r;r<=rg.e.r;r++){ const v=ws[X.utils.encode_cell({r,c})]; if(v&&v.t==='n'){ v.z='#,##0.00'; w=Math.max(w,12) } else if(v&&v.v!=null&&r>heads.length) w=Math.max(w,Math.min(60,String(v.v).length+2)) } cols.push({wch:w}) } ws['!cols']=cols; return ws; };
  const wb=X.utils.book_new(); const secs=[...paper.querySelectorAll('[data-sheet]')];

function spendBy(key){ const R={}; const add=(id,amt,t)=>{ if(!id)return; const r=R[id]=R[id]||{spent:0,loan:0,items:[]}; r.spent+=amt; r.items.push({t,amt}); };
  for(const t of S.tx){ if(t.kind==='pay'&&!t.remit) add(t[key],sat(t.amount),t);
    else if(t.kind==='loanret'&&sat(t.voucher)){ const l=S.tx.find(x=>x.id===t.loanId)||{}; add(l[key],sat(t.voucher),t); } }
  for(const l of S.tx){ if(l.kind==='loan'&&l[key]){ const d=loanDue(l); if(d>0){ const r=R[l[key]]=R[l[key]]||{spent:0,loan:0,items:[]}; r.loan+=d } } }
  return R; }

  const P=position(null,id); for(const l of legs(t)){ if(l.d>0&&((P[l.f]||{})[l.loc]||0)<0){toast('ลบไม่ได้ เพราะเงินที่รับจากรายการนี้ถูกจ่ายออกไปแล้ว');return} }
  if(!await ask(`ลบรายการ "${t.desc||KIND[t.kind]}" จำนวน ${baht(t.amount)} บาท ทะเบียนคุมที่เกี่ยวข้องจะถูกปรับยอดทั้งหมด`,'ลบรายการ'))return;
  const r=S.reqs.find(x=>x.txId===id); await del('tx',id); if(r){ const n={...r,status:'ok'}; delete n.txId; await put('reqs',r.id,n) } toast('ลบแล้ว'); }
function pickImage(key,max,done){ const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.addEventListener('change',()=>{ const f=inp.files[0]; if(!f)return; const fr=new FileReader();
    fr.onload=()=>{ const im=new Image(); im.onload=async()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        try{ await put('config','main',{...S.cfg,[key]:c.toDataURL('image/png')}); toast(done) }catch(e){ toast('บันทึกรูปไม่สำเร็จ') } }; im.onerror=()=>toast('เปิดไฟล์รูปไม่ได้ ใช้ไฟล์ PNG หรือ JPG'); im.src=fr.result }; fr.readAsDataURL(f) });

    const rows=L.map((p,i)=>{ const b=sat(p.budget), u=(Sp[p.id]||{spent:0}).spent; T[0]+=b;T[1]+=u; return `<tr><td class="cc">${i+1}</td><td>${esc(p.no)}</td><td>${esc(p.name)}<br>${esc(p.objective||'')}</td><td>${esc(p.owner||'')}</td><td class="cc">${thShort(p.start)} – ${thShort(p.end)}</td><td class="n">${fmt(b)}</td><td class="n">${fmt(u)}</td><td class="n">${fmt(b-u)}</td><td class="cc">${(PSTAT.find(x=>x[0]===p.status)||PSTAT[0])[1]}</td></tr>` }).join('');
    const title=`ทะเบียนโครงการ ปีงบประมาณ ${U.pfy==='all'?'ทุกปี':(U.pfy||U.fy)}`; showDoc(title,`<h2>${esc(title)}</h2><h2>${esc(sch())}</h2><table><thead><tr><th>ที่</th><th>รหัส</th><th>โครงการ / วัตถุประสงค์</th><th>ผู้รับผิดชอบ</th><th>ระยะเวลา</th><th>งบประมาณ</th><th>ใช้ไป</th><th>คงเหลือ</th><th>สถานะ</th></tr></thead><tbody>${rows}<tr class="tot"><td colspan="5">รวม ${L.length} โครงการ</td><td class="n">${fmt(T[0])}</td><td class="n">${fmt(T[1])}</td><td class="n">${fmt(T[0]-T[1])}</td><td></td></tr></tbody></table><div class="sigs">${sig(S.cfg.finance,'เจ้าหน้าที่การเงิน')}${sig(S.cfg.director,S.cfg.dirPos||'ผู้อำนวยการ'+sch())}</div>`,true) },
  accttab:d=>{U.acctTab=d.key;render()}, acctmeta:()=>acctMetaForm(),
  acctdoc:()=>{ const h=+U.half||1, D=acctDoc(U.fy,h); const title=`รายงานบัญชีโรงเรียน ปีงบประมาณ ${U.fy} ครั้งที่ ${h}`;
    showDoc(title,`<h2>${esc(title)}</h2><h2>${esc(sch())} ${esc(S.cfg.area||'')}</h2>`+['part1','part2','part3','part4','part5'].map((k,i)=>`<section data-sheet="ส่วนที่${i+1}"${i?' style="break-before:page"':''}>${D[k]}</section>`).join('')+D.check,true) },

  recv:()=>recvForm(), pay:()=>payForm(), move:()=>moveForm(), xfund:()=>xfundForm(), openbal:()=>openBalForm(),
  edit:d=>{const t=byId('tx',d.id); ({recv:recvForm,pay:payForm,move:moveForm,xfund:xfundForm})[t.kind](t)}, deltx:d=>delTx(d.id),
  req:()=>reqForm(), reqedit:d=>reqForm(byId('reqs',d.id)), reqok:d=>{const r=byId('reqs',d.id);put('reqs',r.id,{...r,status:'ok'})}, reqno:d=>{const r=byId('reqs',d.id);put('reqs',r.id,{...r,status:'no'})},
  reqpay:d=>payForm(null,byId('reqs',d.id)), reqdel:async d=>{ if(await ask('ลบบันทึกขอเบิกนี้','ลบ')) del('reqs',d.id) },
  docreq:d=>{const r=byId('reqs',d.id);showDoc(`บันทึกขอเบิกเงิน กง ${r.no}-${fyOf(r.date)}`,docReq(r))},
  loan:()=>loanForm(), loanret:d=>loanRetForm(byId('tx',d.id)), docloan:d=>{const l=byId('tx',d.id);showDoc(`สัญญายืมเงิน บย ${l.no}-${fyOf(l.date)}`,docLoan(l))}, docret:d=>{const r=byId('tx',d.id);showDoc(`บันทึกส่งใช้เงินยืม ${thShort(r.date)}`,docLoanRet(r))},
  remit:()=>remitForm(), docwht:d=>{const t=byId('tx',d.id);showDoc(`หนังสือรับรองหักภาษี บษ ${t.wht.no}-${fyOf(t.date)}`,docWht(t))},
  ordtab:d=>{U.ordTab=d.key;render()}, order:()=>orderForm(), orderedit:d=>orderForm(byId('orders',d.id)), orderdel:async d=>{ if(await ask('ลบคำสั่งนี้','ลบ')) del('orders',d.id) },
  docorder:d=>{const o=byId('orders',d.id);showDoc(`คำสั่ง ${o.no}-${fyOf(o.date)} ${o.title}`,docOrder(o))},
  acc:()=>accForm(), accedit:d=>accForm(byId('accounts',d.id)), accclose:d=>accCloseForm(byId('accounts',d.id)),
  accdel:async d=>{ if(S.tx.some(t=>t.loc==='bank:'+d.id||t.loc2==='bank:'+d.id)){toast('บัญชีนี้มีรายการในทะเบียนแล้ว ลบไม่ได้ ให้ใช้ปิดบัญชีแทน');return} if(await ask('ลบบัญชีธนาคารนี้','ลบ')) del('accounts',d.id) },
  docaccopen:d=>{const a=byId('accounts',d.id);showDoc(`บันทึกขอเปิดบัญชี ${a.bank} ${a.number}`,docAcc(a,false))}, docaccclose:d=>{const a=byId('accounts',d.id);showDoc(`บันทึกขอปิดบัญชี ${a.bank} ${a.number}`,docAcc(a,true))},
  cash:()=>cashForm(), doccash:d=>{const m=byId('memos',d.id);showDoc(`บันทึกเก็บรักษาเงินสด ${thShort(m.date)}`,docCash(m))}, memodel:async d=>{ if(await ask('ลบบันทึกนี้','ลบ')) del('memos',d.id) },
  alloc:()=>allocForm(), deptdoc:()=>{ const rows=deptSummary(U.fy); const title=`รายงานการใช้จ่ายแยก 4 ฝ่าย ปีงบประมาณ ${U.fy}`; showDoc(title,docTable(title,'สรุปตามฝ่าย',deptTableHTML(rows).replace('class="t"',''))+'<p class="c"><b>ใช้จ่ายแยกตามประเภทเงินและฝ่าย</b></p>'+deptMatrixHTML(rows).replace('class="t"','')+'<p class="c"><b>รายการจ่าย'+(U.dept==='all'?'ทุกฝ่าย':deptName(U.dept))+'</b></p>'+deptItemsHTML(rows).replace('class="t"','')+`<div class="sigs">${sig(S.cfg.finance,'เจ้าหน้าที่การเงิน')}${sig(S.cfg.director,S.cfg.dirPos||'ผู้อำนวยการ'+sch())}</div>`,true) },
  docdaily:()=>showDoc(`รายงานเงินคงเหลือประจำวัน ${thShort(U.daily)}`,docDaily(U.daily)),
  regmode:d=>{U.regMode=d.key;render()},
  docreg:d=>{ const mode=d.mode||U.regMode, key=d.key||U.regDoc; let title,tbl;
    if(mode==='doc'){title=`ทะเบียนคุม ${key}. ${docLabel(key)}`;tbl=regDocHTML(key)} else if(mode==='fund'){const f=fund(U.regFund); if(!f)return; title=`ทะเบียนคุมเงิน ${f.name}`;tbl=regFundHTML(f.id)} else {title=`ทะเบียนคุม ${locName(U.regAcc)}`;tbl=regAccHTML(U.regAcc)}
    showDoc(title,docTable(title,'',tbl.replace('class="t"','')),true) },
  logo:()=>pickImage('logo',176,'เปลี่ยนตราโรงเรียนแล้ว'),
  garuda:()=>pickImage('garuda',600,'เปลี่ยนตราครุฑแล้ว'),
  garudareset:async()=>{ const c={...S.cfg}; delete c.garuda; await put('config','main',c); toast('กลับไปใช้ตราครุฑเริ่มต้นแล้ว') },
  cfg:()=>cfgForm(), fund:()=>fundForm(), fundedit:d=>fundForm(byId('funds',d.id)),
  funddel:async d=>{ if(S.tx.some(t=>legs(t).some(l=>l.f===d.id))||S.reqs.some(r=>r.fund===d.id)){toast('ประเภทเงินนี้มีรายการในทะเบียนแล้ว ลบไม่ได้');return} if(await ask('ลบประเภทเงินนี้','ลบ')) del('funds',d.id) },
  clearsample:async()=>{ if(!await ask('ล้างรายการ บัญชีธนาคาร คำสั่ง และบันทึกที่เป็นตัวอย่างทั้งหมด ประเภทเงินมาตรฐานจะยังอยู่','ล้างข้อมูลตัวอย่าง'))return;
    try{ const gone=new Set(S.accounts.filter(a=>a.sample).map(a=>a.id));
      for(const k of ['tx','reqs','orders','memos','accounts']) for(const x of S[k].filter(x=>x.sample)) await del(k,x.id);
      for(const f of S.funds.filter(f=>rawAccs(f).some(id=>gone.has(id)))){ const a=rawAccs(f).filter(id=>!gone.has(id)); await put('funds',f.id,{...f,accs:a,acc:a[0]||''}) }
      if(S.cfg.sample) await put('config','main',{thaiNum:false,...(S.cfg.logo?{logo:S.cfg.logo}:{})});
      toast('ล้างข้อมูลตัวอย่างแล้ว กรอกข้อมูลโรงเรียนที่ตั้งค่าข้อมูลหลัก'); location.hash='set'; }
    catch(e){ toast('ล้างข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง') } }
};
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b)return; const f=ACT[b.dataset.act]; if(f) Promise.resolve(f(b.dataset)).catch(x=>toast('ทำรายการไม่สำเร็จ'+(x&&x.code?' ('+x.code+')':''))) });
document.addEventListener('change',e=>{ const k=e.target.dataset&&e.target.dataset.u; if(k){ if(e.target.value) U[k]=e.target.value; render() } else if(e.target.id==='fySel'){ U.fy=+e.target.value; if(fyOf(U.daily)!==U.fy) U.daily=fyOf(today())===U.fy?today():fyEnd(U.fy); render() } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const o=[...document.querySelectorAll('.ov')].pop(); if(o) o.remove() } });
boot();
})();
</script>
